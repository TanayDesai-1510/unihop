services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu-24.04
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: unihop
      POSTGRES_USER: unihop
      POSTGRES_PASSWORD: unihop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
