name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend_tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        run: ./mvnw --batch-mode --no-transfer-progress test

  frontend_quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
      NEXT_PUBLIC_USE_MOCKS: "true"
      NEXT_PUBLIC_MOCKPAY_URL: http://localhost:8080/mockpay/v1
      NEXT_PUBLIC_DEMO_SHOW_ALL_WALLETS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  golden_path:
    name: Golden-path smoke
    needs: [backend_tests, frontend_quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      ANTHROPIC_API_KEY: ""
      ELEVENLABS_API_KEY: ""
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      RIDE_TIMEOUT_SECONDS: "120"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run isolated golden path
        shell: bash
        run: |
          set -euo pipefail

          backend_log="$RUNNER_TEMP/unihop-backend.log"
          backend_pid=""

          cleanup() {
            if [[ -n "$backend_pid" ]]; then
              kill "$backend_pid" 2>/dev/null || true
              wait "$backend_pid" 2>/dev/null || true
            fi
            docker compose -f .devcontainer/docker-compose.yml down -v || true
          }
          trap cleanup EXIT

          docker compose -f .devcontainer/docker-compose.yml up -d db
          for attempt in {1..30}; do
            if docker compose -f .devcontainer/docker-compose.yml exec -T db pg_isready -U unihop >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              docker compose -f .devcontainer/docker-compose.yml logs db
              exit 1
            fi
            sleep 1
          done

          (cd backend && ./mvnw --batch-mode --no-transfer-progress package -DskipTests)
          backend_jar="$(find backend/target -maxdepth 1 -name 'backend-*.jar' ! -name '*.original' -print -quit)"
          test -n "$backend_jar"
          java -jar "$backend_jar" >"$backend_log" 2>&1 &
          backend_pid=$!

          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/api/health >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              cat "$backend_log"
              exit 1
            fi
            if [[ "$attempt" == "60" ]]; then
              cat "$backend_log"
              exit 1
            fi
            sleep 1
          done

          if ! scripts/smoke.sh; then
            cat "$backend_log"
            exit 1
          fi

  ci_passed:
    name: CI passed
    if: ${{ always() }}
    needs: [backend_tests, frontend_quality, golden_path]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify required jobs
        env:
          BACKEND_RESULT: ${{ needs.backend_tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend_quality.result }}
          GOLDEN_PATH_RESULT: ${{ needs.golden_path.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$GOLDEN_PATH_RESULT" = success
